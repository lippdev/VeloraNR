<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeloraNR · Player in-game</title>
<style>
@font-face{font-family:Instrument;src:url(fonts/instrument-sans.woff2)}*{box-sizing:border-box}body{margin:0;background:#131416;color:#f1f0ed;font:15px/1.4 Instrument,"Segoe UI",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #ffd299;outline-offset:3px}
header,main{max-width:1200px;margin:auto;padding:0 clamp(16px,4vw,56px)}header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15}header strong{letter-spacing:-.04em;font-size:20px}header span,small{color:#b4b3b0}h1{font-size:clamp(27px,4vw,42px);line-height:1.1;letter-spacing:-.045em;margin:32px 0 16px}
#player{position:relative;isolation:isolate;display:flex;overflow:hidden;aspect-ratio:16/9;border-radius:14px;background:black;box-shadow:0 12px 38px #0004;--sidebar:min(310px,78%)}#player:fullscreen{width:100%;height:100%;border-radius:0}
.stage{position:relative;min-width:0;flex:1}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.controls{position:absolute;bottom:0;width:100%;display:flex;align-items:center;padding:32px 14px 12px;gap:8px;background:linear-gradient(transparent,#000c);transition:opacity .16s}.controls button,.edge{background:#18191dba;border:1px solid #ffffff34;border-radius:9px;width:40px;height:38px;display:grid;place-items:center}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.spacer{flex:1}.time{font-size:12px;font-variant-numeric:tabular-nums}.edge{position:absolute;left:0;top:48%;width:25px;height:52px;border-radius:0 9px 9px 0}.pinned .edge,.open .edge{visibility:hidden}.idle .controls:not(:focus-within){opacity:0;pointer-events:none}
aside{position:absolute;inset:0 auto 0 0;width:var(--sidebar);z-index:3;background:#202124;box-shadow:4px 0 22px #0005;padding:16px;overflow:auto;transform:translateX(-103%);visibility:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),visibility 0s .18s}.open aside{transform:none;visibility:visible;transition-delay:0s}.pinned aside{position:relative;flex:none}.bar{display:flex;align-items:center;gap:8px}.bar h2{font-size:18px;letter-spacing:-.035em;margin:0;flex:1}.bar button,footer button{border:1px solid #ffffff22;border-radius:7px;background:#303135;padding:6px 10px}.bar button[aria-pressed=true]{background:#e7e5df;color:#202124}.bar button:last-child{display:grid;place-items:center;padding:6px}
fieldset{border:0;margin:20px 0 0;padding:0}legend{font-size:12px;font-weight:650;color:#b2b1af;margin-bottom:4px}aside label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff12}select{background:#2d2e31;border:1px solid #ffffff29;border-radius:6px;padding:5px;max-width:58%}input[type=checkbox]{width:32px;height:19px;appearance:none;background:#505158;border-radius:16px;cursor:pointer;position:relative}input[type=checkbox]:before{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;background:white;border-radius:50%;transition:transform .14s}input:checked{background:#578664}input:checked:before{transform:translateX(13px)}
#toast{position:absolute;z-index:2;bottom:66px;left:50%;transform:translateX(-50%);max-width:95%;width:max-content;background:#202124f5;border:1px solid #ffffff25;border-radius:9px;padding:7px 12px;font-size:13px;pointer-events:none}#toast:empty,[hidden]{display:none!important}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0 30px}footer button{white-space:nowrap}
@media(max-width:700px){#player{aspect-ratio:4/3}main{padding:0 10px}.pinned .controls .time{display:none}.pinned{--sidebar:min(245px,64%)!important}aside{padding:10px}footer{align-items:flex-start;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}
</style>
<header><strong>VeloraNR</strong><span>Remote Play · PS5</span></header>
<main><h1>Player</h1><div id="player">
<aside id="settings" aria-label="Ajustes rápidos" inert>
<div class="bar"><h2>Ajustes rápidos</h2><button id="pin" aria-pressed="false">Fixar</button><button id="close" aria-label="Fechar ajustes">×</button></div>
<fieldset><legend>Imagem</legend><label>DLSS 5<input type="checkbox" data-name="DLSS 5"></label><label>Antisserrilhamento<select data-name="Antisserrilhamento"><option>Desligado</option><option>FXAA</option><option>SMAA</option><option>MLAA</option><option>DLAA</option></select></label><label>Super-resolução<select data-name="Super-resolução"><option>Desligada</option><option>1440p</option><option>4K</option></select></label></fieldset>
<fieldset><legend>Frame Generation</legend><label>Modo<select id="mode" data-name="Modo"><option>Externo</option><option>Interno</option></select></label><label>Gerador<select id="gen" data-name="Gerador"></select></label><label>Multiplicador<select id="mult" data-name="Frame Generation"></select></label><label id="counterRow">Contador<select data-name="Contador"><option>Real / saída</option><option>FPS final</option></select></label></fieldset>
</aside><div class="stage"><video id="video" muted autoplay loop playsinline aria-label="Vídeo de demonstração"></video>
<button class="edge" id="edge" aria-label="Abrir ajustes rápidos" aria-controls="settings" aria-expanded="false">›</button>
<div class="controls"><button id="play" aria-label="Pausar"></button><span class="time" id="time"></span><div class="spacer"></div><button id="sound" aria-label="Ativar som"></button><button id="full" aria-label="Tela cheia" title="Tela cheia"></button></div>
<div id="toast" role="status" aria-live="polite"></div></div></div>
<footer><small id="source">Vídeo de demonstração · Ajustes de imagem simulados</small><button id="load">Abrir vídeo local</button><input hidden type="file" accept="video/*" id="file"></footer></main>

function closePanel(){clearTimeout(leaveTimer);pinned=false;player.classList.remove('open','pinned');panel.inert=true;edge.setAttribute('aria-expanded','false');$('pin').textContent='Fixar';$('pin').setAttribute('aria-pressed','false');awake()}
let keyboard=false;document.addEventListener('keydown',()=>keyboard=true,true);document.addEventListener('pointerdown',()=>keyboard=false,true);

player.onpointermove=e=>{awake();if(e.pointerType==='mouse'&&e.clientX-player.getBoundingClientRect().left<12)openPanel()};
panel.onpointerenter=openPanel;panel.onpointerleave=later;panel.onfocusin=()=>clearTimeout(leaveTimer);panel.onfocusout=()=>setTimeout(()=>{if(!panel.matches(':hover'))later()},0);

function options(select,values){const old=select.value;select.replaceChildren(...values.map(v=>new Option(v,v)));if(values.includes(old))select.value=old}
const internal={'NVIDIA VFG':8,'Intel XeSS FG':4,'NVIDIA DLSS FG':6,'AMD FSR 3.1':2,'AMD FSR 4 ML':2,'ANR FG':6,'AMD FRC':2,'RIFE':3,'XeFG XMX':6},external={'Super Motion':6,'NVIDIA DLSS MFG':6,'Intel XeSS MFG':6};
function generators(){const list=$('mode').value==='Externo'?external:internal;options($('gen'),Object.keys(list));options($('mult'),['Desligado',...Array.from({length:list[$('gen').value]-1},(_,i)=>(i+2)+'×')]);$('counterRow').hidden=list===internal}
generators();panel.onchange=e=>{if(e.target===$('mode')||e.target===$('gen'))generators();const t=e.target;notify(t.dataset.name+' · '+(t.type==='checkbox'?(t.checked?'Ativado':'Desativado'):t.value))};
function playback(){icon('play',video.paused?'play':'pause',video.paused?'Reproduzir':'Pausar');awake()}
video.onpause=video.onplay=playback;playback();$('play').onclick=()=>video.paused?video.play().catch(()=>notify('Não foi possível reproduzir o vídeo')):video.pause();
function sound(){icon('sound',video.muted?'mute':'sound',video.muted?'Ativar som':'Silenciar')}sound();$('sound').onclick=()=>{video.muted=!video.muted;sound()};
function fullscreen(){const active=document.fullscreenElement===player;icon('full',active?'exit':'full',active?'Sair da tela cheia':'Tela cheia');awake()}
fullscreen();document.onfullscreenchange=fullscreen;$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await player.requestFullscreen()}catch{notify('Tela cheia indisponível neste navegador')}};
document.onkeydown=e=>{if(e.key==='Escape'&&player.classList.contains('open'))$('close').click()};
video.ontimeupdate=()=>{const t=Math.floor(video.currentTime);$('time').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
$('load').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);video.src=url;$('source').textContent=f.name+' · Ajustes de imagem simulados';video.play().catch(()=>notify('Não foi possível reproduzir este arquivo'));e.target.value=''};
