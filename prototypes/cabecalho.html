<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeloraNR · Estudo do cabeçalho</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Consolas,monospace;color:var(--foreground,#eee);color-scheme:dark}main{padding-bottom:84px}header{background:#101111;color:#efeee9;overflow:hidden;position:relative;padding:clamp(18px,4vw,56px);isolation:isolate;border-bottom:1px solid #51524e;display:flex;align-items:center;justify-content:space-between;min-height:295px}h1{font-size:clamp(32px,6vw,86px);letter-spacing:-.07em;line-height:1;margin:10px 0}p{font-size:clamp(11px,1.6vw,18px);color:#aaa;margin:12px 0}pre{font:inherit;white-space:pre;margin:0}.sky{position:absolute;inset:0;z-index:-1;color:#797c73;overflow:hidden;font:12px/12px Consolas,monospace;opacity:.75}.machine{font:clamp(8px,1.55vw,19px)/1 Consolas,monospace;color:#e6e6df;text-shadow:0 0 8px #ddd2}.portrait{flex-direction:column-reverse;text-align:center;gap:22px;padding:28px}.portrait h1{font-size:40px}.compact{min-height:100px;padding:20px;gap:12px}.compact h1{font-size:30px}.compact .machine{font-size:12px}.compact p{margin:6px 0}footer{padding:16px;color:var(--muted-foreground,#999);font-size:12px}@media(max-width:490px){header:not(.compact){flex-direction:column;gap:24px;align-items:flex-start}.machine{align-self:center;font-size:11px}.portrait h1{font-size:28px}}
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style><main><div id="stage"></div><footer>VeloraNR / Estudo do cabeçalho</footer></main>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Horizonte</button>
  <button class="proto-picker-item">Retrato</button>
  <button class="proto-picker-item">Compacto</button>
</nav>
<script>
const hardware=String.raw`               _.-'|
         __.-''   :| |\
    _.-''      .::| | |
   /          .::/  | |
   |         .::/   | |
   |         ::|    | |           ______________
   |         ::|    | |        .-'  .--------.  '-.
   |         ::|    | |       /  _   \______/  .   \
   |         ::|    | |      /  -+-    __    o   o  \
   |         ::|    | |     /    '   (__) (__) o    \
   |         ::|    | |    /    .---.________.---.   \
   |         ::|    | |    |  .'                  '. |
   |_________::|____|_/    '-'                      '-'
  /__________________\ `;
function sky(){let rows=[];for(let y=0;y<26;y++){let row='';for(let x=0;x<260;x++){const h=22+2*Math.sin(x*.08)+Math.sin(x*.29);const n=(x*73+y*241+x*y*19)%467;row+=Math.abs(h-y)<.6?(Math.cos(x*.08)>0?'\\':'/'):y>h&&n%13===0?':':y<h-4&&n<4?(n===1?'+':'.'):' ';}rows.push(row)}return rows.join('\n')}
const compact=String.raw`    /| |
   / | |   .------.
  |  | |  / + __ o \
  |__|_|  '--'  '--'`;
function header(mode){return '<header class="'+mode+'">'+(mode==='horizon'?'<pre class="sky" aria-hidden="true">'+sky()+'</pre>':'')+'<div><h1>VeloraNR</h1><p>&gt; Remote Play · PS5_</p></div><pre class="machine" role="img" aria-label="PS5 e controle desenhados com caracteres ASCII">'+(mode==='compact'?compact:hardware)+'</pre></header>'}
const variants=['horizon','portrait','compact'].map(mode=>()=>header(mode));
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  try { history.replaceState(null, '', url); } catch {}
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script></html>
